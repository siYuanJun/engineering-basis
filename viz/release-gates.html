<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 闸门流转</title>
<style>
  :root{
    --bg:#0B1220; --panel:rgba(17,26,43,.72); --line:rgba(120,150,190,.18);
    --text:#E6EDF7; --dim:#93A4B8; --hi:#FFD166; --pass:#3DDC97; --block:#FF6B5A;
    --font:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{background:#060B14}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 46%, #142442 0%, #0B1220 54%, #060B14 100%);color:var(--text);font-family:var(--font);overflow:hidden}
  #stage{position:fixed;inset:0}
  .hud{position:fixed;inset:0;pointer-events:none}
  .tl{position:absolute;left:4vw;top:6vh;max-width:32vw}
  .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  h1{font-size:clamp(22px,2.4vw,34px);font-weight:600;margin:.55em 0 .3em;line-height:1.25}
  .sub{font-size:13.5px;color:var(--dim);line-height:1.7}
  .tr{position:absolute;right:3vw;top:5vh;display:flex;gap:9px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
  button{
    font-family:var(--font);font-size:12.5px;color:var(--text);
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:8px 15px;cursor:pointer;backdrop-filter:blur(10px);transition:.18s;
  }
  button:hover{border-color:rgba(255,209,102,.5);color:#fff}
  button.on{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.6)}
  .sep{width:1px;height:22px;background:var(--line);align-self:center;margin:0 3px}
  .card{
    position:absolute;right:3vw;top:13vh;width:min(340px,30vw);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:17px 19px;backdrop-filter:blur(14px);pointer-events:auto;
  }
  .card .k{font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
  .card .t{font-size:16px;font-weight:600;margin:7px 0 5px}
  .card .b{font-size:12.5px;line-height:1.75;color:#C7D3E3}
  .card .out{
    margin-top:10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#C7D3E3;
    background:rgba(7,12,22,.55);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    white-space:pre;overflow-x:auto;max-height:120px;
  }
  .step{position:absolute;left:4vw;bottom:6vh;width:min(420px,38vw);border-left:2px solid var(--hi);padding:2px 0 2px 15px}
  .step .n{font-size:11.5px;color:var(--hi);letter-spacing:.14em}
  .step .h{font-size:15px;font-weight:600;margin:6px 0 4px}
  .step .p{font-size:12.5px;color:#C7D3E3;line-height:1.7}
  .hint{position:absolute;left:50%;bottom:2.2vh;transform:translateX(-50%);font-size:11.5px;color:var(--dim)}
  .labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:12px;color:#DCE6F4;text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity .18s}
  .label.gate{font-size:13px;font-weight:600;letter-spacing:.04em;color:#fff}
  .label.gate .id{color:#8FB4E8;font-weight:500;margin-right:7px}
  .label.state{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.08em}
  .label.term{font-size:11px;color:#93A4B8;letter-spacing:.1em}
@media (max-width:900px){
    .tl{max-width:44vw}
    .card{top:auto;bottom:4vh;right:3vw;width:min(300px,46vw);padding:12px 14px}
    .card .b{font-size:11.5px}
    .step{width:46vw;bottom:4vh}
  }
body.embed .tl{left:3vw;top:4vh;max-width:62vw}
  body.embed h1{font-size:22px;margin:.35em 0 .15em}
  body.embed .sub{display:none}
  body.embed .tr{left:3vw;right:auto;top:96px;justify-content:flex-start}
  body.embed button{font-size:11px;padding:6px 11px}
  body.embed .card{top:auto;bottom:3.5vh;right:auto;left:3vw;width:min(258px,34vw);padding:11px 13px}
  body.embed .card .t{font-size:14.5px;margin:5px 0 4px}
  body.embed .card .b{font-size:11px;line-height:1.6}
  body.embed .card .out{font-size:10px;max-height:64px}
  body.embed .step{display:none!important}
  body.embed .hint{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div class="labels" id="labels"></div>
<div class="hud">
  <div class="tl">
    <div class="eyebrow" id="eyebrow">RELEASE-LOOP · 3D 流转</div>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>

  <div class="tr" id="cases"></div>

  <div class="card" id="card">
    <div class="k" id="cardK">当前</div>
    <div class="t" id="cardT">选择一个样例</div>
    <div class="b" id="cardB">选择上面的样例，看这个版本走到第几关、为什么停。</div>
    <div class="out" id="cardO" style="display:none"></div>
  </div>

  <div class="step" id="step" style="display:none">
    <div class="n" id="stepN"></div>
    <div class="h" id="stepH"></div>
    <div class="p" id="stepP"></div>
  </div>

  <div class="hint">拖拽旋转 · 滚轮缩放 · 双击复位 · 点闸门看判据</div>
</div>

<script type="importmap">
{"imports":{"three":"./three.module.min.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const SPEC = {"title": "发版前，四道闸门怎么拦", "eyebrow": "RELEASE-LOOP · 3D 流转", "subtitle": "同一份契约快照，三种改法：一个放行，两个停在第 1 关。结论来自 release-loop 的实跑。", "gates": [{"id": "L1", "name": "契约", "rule": "快照比对：端点、请求与响应字段少一个就阻断；只加字段不算破坏。", "detail": "提交前跑 diff。字段改名、端点删除直接 exit 1，版本停在原地。"}, {"id": "L2", "name": "同源", "rule": "合入前确认前后端制品来自同一次构建，版本只有一个来源。", "detail": "镜像 tag 与提交对不上，就不进入冒烟；避免拿旧包验证新代码。"}, {"id": "L3", "name": "冒烟", "rule": "发版后跑真实业务链路：取验证码、图片非空、提交、拿到 token。", "detail": "健康检查 200 只证明进程活着，端点被删也照样 200，不作数。"}, {"id": "L4", "name": "生产只读", "rule": "灰度与回滚窗口内只做只读核查，执行与回滚由人确认。", "detail": "这一步不再由脚本按回车，判断交给值班的人。"}], "cases": [{"id": "A", "label": "字段改名", "title": "响应字段被改名", "gate": "L1", "exit": 1, "reason": "GET /api/captcha 的 code 字段被删除或改名；新增字段 1 条不能抵消。", "script": "contract_snapshot.py diff", "metrics": "breaking 1 / additive 1", "intro": "验证码接口把 code 改名 imageCode，前端还按 code 取值。", "stopNote": "阻断后不进 L2。要么前后端同批改，要么回退这次改名。"}, {"id": "B", "label": "只加字段", "title": "只新增字段", "gate": null, "exit": 0, "passNote": "新增 expiresIn 一个字段，老前端不读也不受影响，四关放行。", "metrics": "breaking 0 / additive 1", "intro": "登录响应多了一个 expiresIn，没有删除或改名。"}, {"id": "C", "label": "端点删除", "title": "端点被删掉", "gate": "L1", "exit": 1, "reason": "GET /api/health 端点被删除；探活脚本还在调它。", "script": "contract_snapshot.py diff", "metrics": "breaking 1 / additive 0", "intro": "健康检查端点被删，服务还能起来，但发版脚本会挂在下一步。", "stopNote": "同样停在第 1 关。端点删除比字段改名更彻底。"}]};
if (location.search.includes('embed')) document.body.classList.add('embed');
const stage = document.getElementById('stage');
const labelBox = document.getElementById('labels');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0B1220, 0.022);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const COMPACT = innerWidth < 1100;
const CAM0 = {theta: 0.18, phi: 0.95, radius: COMPACT ? 19.5 : 24, ty: COMPACT ? 1.95 : 1.6};
const cam = {...CAM0};
const camTarget = {...cam};
function applyCam(){
  const sp = Math.sin(cam.phi);
  camera.position.set(cam.radius*sp*Math.sin(cam.theta), cam.radius*Math.cos(cam.phi), cam.radius*sp*Math.cos(cam.theta));
  camera.lookAt(0, cam.ty, 0);
}
applyCam();

// 光
scene.add(new THREE.HemisphereLight(0xA8C0E0, 0x101B2D, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.7);
key.position.set(6, 12, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x6FA8FF, 0.85);
rim.position.set(-8, 6, -10);
scene.add(rim);

// 地面与网格
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 26),
  new THREE.MeshStandardMaterial({color:0x122036, roughness:.6, metalness:.35})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.02;
scene.add(floor);
const grid = new THREE.GridHelper(36, 36, 0x27405F, 0x18283D);
grid.position.y = 0;
scene.add(grid);

// 轨道
const TRACK_LEN = 18, TRACK_W = 1.5;
const trackMat = new THREE.MeshStandardMaterial({color:0x1E3352, roughness:.45, metalness:.4});
const track = new THREE.Mesh(new THREE.BoxGeometry(TRACK_LEN, .1, 1.9), trackMat);
track.position.set(0, .03, 0);
scene.add(track);
const centerLine = new THREE.Mesh(
  new THREE.BoxGeometry(TRACK_LEN, .012, .09),
  new THREE.MeshBasicMaterial({color:0x5A9BE0, transparent:true, opacity:.85})
);
centerLine.position.set(0, .08, 0);
scene.add(centerLine);

const GATES = SPEC.gates || [];
const GATE_X = [-5.4, -1.8, 1.8, 5.4];
const labels = [];
const gateGroups = [];
const gateState = new Map();

const C_PASS = new THREE.Color(0x3DDC97);
const C_BLOCK = new THREE.Color(0xFF6B5A);
const C_IDLE = new THREE.Color(0x4A6FA5);

function makeLabel(cls, html){
  const el = document.createElement('div');
  el.className = 'label ' + cls;
  el.innerHTML = html;
  labelBox.appendChild(el);
  return el;
}

GATES.forEach((g, i) => {
  const x = GATE_X[i] ?? (-6 + i*4);
  const group = new THREE.Group();
  group.position.set(x, 0, 0);
  group.userData = {kind:'gate', id:g.id, index:i, spec:g, x};

  const pillarMat = new THREE.MeshStandardMaterial({color:0x3C5878, roughness:.35, metalness:.5, emissive:0x1D3350, emissiveIntensity:.55});
  const beamMat = new THREE.MeshStandardMaterial({color:0x486A90, roughness:.35, metalness:.5, emissive:0x1D3350, emissiveIntensity:.55});

  const p1 = new THREE.Mesh(new THREE.BoxGeometry(.22, 3.5, .22), pillarMat);
  p1.position.set(0, 1.75, 1.45);
  const p2 = p1.clone(); p2.position.z = -1.45;
  const beam = new THREE.Mesh(new THREE.BoxGeometry(.24, .24, 3.1), beamMat);
  beam.position.set(0, 3.5, 0);
  [p1,p2,beam].forEach(m => { m.userData.owner = group; group.add(m); });

  // 闸门内的判定面
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(2.8, 3.1),
    new THREE.MeshBasicMaterial({color:0x2F4E78, transparent:true, opacity:.12, side:THREE.DoubleSide})
  );
  plane.rotation.y = Math.PI/2;
  plane.position.set(0, 1.8, 0);
  group.add(plane);
  group.userData.plane = plane;

  // 门槛光带
  const sill = new THREE.Mesh(
    new THREE.BoxGeometry(.6, .02, 3),
    new THREE.MeshBasicMaterial({color:0x4A6FA5, transparent:true, opacity:.5})
  );
  sill.position.set(0, .08, 0);
  group.add(sill);
  group.userData.sill = sill;

  // 门上的指示灯
  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(.11, 20, 20),
    new THREE.MeshBasicMaterial({color:0x4A6FA5})
  );
  lamp.position.set(0, 3.5, 0);
  group.add(lamp);
  group.userData.lamp = lamp;

  group.userData.baseColors = [pillarMat, beamMat];
  scene.add(group);
  gateGroups.push(group);
  gateState.set(g.id, {state:'idle'});

  const label = makeLabel('gate', `<span class="id">${g.id}</span>${g.name}`);
  labels.push({el:label, get:()=> new THREE.Vector3(x, 4.15, 0), w:120, h:20, kind:'gate'});
});

// 起点与终点
function makeTerminal(x, text){
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(.9, .06, .9),
    new THREE.MeshStandardMaterial({color:0x1E3352, roughness:.6, emissive:0x0F1B2E, emissiveIntensity:.4})
  );
  m.position.set(x, .04, 0);
  scene.add(m);
  const el = makeLabel('term', text);
  labels.push({el, get:()=> new THREE.Vector3(x, 0.95, 1.55), w:70, h:18, kind:'term'});
}
makeTerminal(-9.4, '候选版本');
makeTerminal(9.4, '上线');

// 输入块
const block = new THREE.Mesh(
  new THREE.BoxGeometry(.82, .82, .82),
  new THREE.MeshStandardMaterial({color:0xFFD166, emissive:0xFFD166, emissiveIntensity:.55, roughness:.4, metalness:.15})
);
block.position.set(-9.4, .95, 0);
scene.add(block);
const blockGlow = new THREE.Mesh(
  new THREE.BoxGeometry(1.06, 1.06, 1.06),
  new THREE.MeshBasicMaterial({color:0xFFD166, transparent:true, opacity:.12})
);
block.add(blockGlow);
const blockLight = new THREE.PointLight(0xFFD166, 1.1, 5);
block.add(blockLight);

// HUD 初始化
document.getElementById('title').textContent = SPEC.title || '';
document.getElementById('sub').textContent = SPEC.subtitle || '';
document.getElementById('eyebrow').textContent = SPEC.eyebrow || '3D FLOW';
const CASES = SPEC.cases || [];
const casesBox = document.getElementById('cases');
const caseBtns = [];
CASES.forEach((c, i) => {
  const b = document.createElement('button');
  b.textContent = c.label || c.id;
  b.onclick = () => startCase(i);
  casesBox.appendChild(b);
  caseBtns.push(b);
});
const sep = document.createElement('div'); sep.className='sep'; casesBox.appendChild(sep);
const btnPlay = document.createElement('button'); btnPlay.textContent='播放'; btnPlay.onclick = () => startCase(activeCase < 0 ? 0 : activeCase);
casesBox.appendChild(btnPlay);
const btnReset = document.createElement('button'); btnReset.textContent='复位'; btnReset.onclick = reset;
casesBox.appendChild(btnReset);

// 播放状态
let activeCase = -1;
let run = null;

function resetGate(g){
  const st = gateState.get(g.userData.id);
  st.state = 'idle';
  g.userData.lamp.material.color.set(C_IDLE);
  g.userData.sill.material.color.set(C_IDLE);
  g.userData.plane.material.color.set(0x2F4E78);
  g.userData.plane.material.opacity = .12;
  g.userData.baseColors.forEach(m => {
    m.emissiveIntensity = .55;
    m.emissive.set(0x1D3350);
  });
}

function markGate(i, state){
  const g = gateGroups[i]; if(!g) return;
  const st = gateState.get(g.userData.id);
  st.state = state;
  const col = state === 'pass' ? C_PASS : state === 'block' ? C_BLOCK : C_IDLE;
  g.userData.lamp.material.color.copy(col);
  g.userData.sill.material.color.copy(col);
  g.userData.plane.material.color.copy(col);
  g.userData.plane.material.opacity = state === 'idle' ? .12 : .2;
  g.userData.baseColors.forEach(m => {
    m.emissive.copy(col);
    m.emissiveIntensity = state === 'idle' ? .55 : 1.0;
  });
}

function reset(){
  activeCase = -1; run = null;
  block.position.set(-9.4, .95, 0);
  gateGroups.forEach(resetGate);
  caseBtns.forEach(b => b.classList.remove('on'));
  document.getElementById('cardK').textContent = '当前';
  document.getElementById('cardT').textContent = '选择一个样例';
  document.getElementById('cardB').textContent = '选择上面的样例，看这个版本走到第几关、为什么停。';
  document.getElementById('cardO').style.display = 'none';
  document.getElementById('step').style.display = 'none';
}

function showCard(kicker, title, body, out){
  document.getElementById('cardK').textContent = kicker;
  document.getElementById('cardT').textContent = title;
  document.getElementById('cardB').textContent = body || '';
  const o = document.getElementById('cardO');
  if (out) { o.style.display='block'; o.textContent = out; } else { o.style.display='none'; }
}

function startCase(i){
  reset();
  activeCase = i;
  caseBtns[i].classList.add('on');
  const c = CASES[i];
  const stopIndex = c.gate ? GATES.findIndex(g => g.id === c.gate) : GATES.length;
  gateGroups.forEach(resetGate);
  block.position.set(-9.4, .95, 0);
  run = {
    t0: performance.now(),
    stopIndex,
    c,
    seg: 0,
    perSegment: 1050,
    stopped: false,
    done: false,
  };
  showCard('样例 ' + (c.id || (i+1)), c.title || c.label || '', c.reason || '', null);
  const step = document.getElementById('step');
  step.style.display = 'block';
  document.getElementById('stepN').textContent = '准备';
  document.getElementById('stepH').textContent = c.label || '';
  document.getElementById('stepP').textContent = c.intro || '从候选版本出发，依次过四道闸门。';
}

function updateRun(now){
  if (!run) return;
  const r = run, c = r.c;
  const gateIdx = c.gate ? GATES.findIndex(g => g.id === c.gate) : -1;
  const segs = gateIdx >= 0 ? gateIdx + 1 : GATES.length;
  const elapsed = now - r.t0;
  const segF = Math.min(segs, elapsed / r.perSegment);
  const cur = Math.min(segs - 1, Math.floor(segF));
  const t = Math.min(1, segF - cur);
  const startX = cur === 0 ? -9.4 : (GATE_X[cur-1] ?? -9.4);
  const endX = cur === segs - 1
    ? (gateIdx >= 0 ? (GATE_X[gateIdx] ?? 0) - 1.15 : 9.4)
    : (GATE_X[cur] ?? 9.4);
  const eased = t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

  if (r.stopped) {
    block.position.x = endX;
    block.position.y = .95;
  } else {
    block.position.x = startX + (endX - startX) * eased;
    block.position.y = .95 + Math.sin(Math.PI * t) * .14;
    block.rotation.y += .015;
  }

  // 按已完成段判定，帧率无关
  for (let i = 0; i < segs; i++) {
    if (segF < i + 1 - 0.1) break;
    const g = gateGroups[i];
    if (!g) continue;
    if (i === gateIdx) {
      if (gateState.get(g.userData.id).state !== 'block') {
        markGate(i, 'block');
        r.stopped = true;
        block.position.x = (GATE_X[i] ?? 0) - 1.15;
        showCard('阻断 · ' + g.userData.id,
          g.userData.spec.name + '：' + (c.blockTitle || '不通过'),
          c.reason || '',
          c.exit != null ? `exit ${c.exit} · ${c.metrics || ''}\n${c.script || ''}` : null);
        document.getElementById('stepN').textContent = `停在第 ${i+1} / ${GATES.length} 关`;
        document.getElementById('stepH').textContent = '不再往下走';
        document.getElementById('stepP').textContent = c.stopNote || '阻断后版本不进入下一关，先修输入。';
      }
    } else {
      if (gateState.get(g.userData.id).state !== 'pass') {
        markGate(i, 'pass');
        showCard('通过 · ' + g.userData.id, g.userData.spec.name, g.userData.spec.rule || '', null);
        document.getElementById('stepN').textContent = `第 ${i+1} / ${GATES.length} 关`;
        document.getElementById('stepH').textContent = g.userData.spec.name;
        document.getElementById('stepP').textContent = g.userData.spec.rule || '';
      }
    }
  }

  if (!r.stopped && segF >= segs && !r.done) {
    r.done = true;
    block.position.x = 9.4;
    document.getElementById('stepN').textContent = '完成';
    document.getElementById('stepH').textContent = '上线';
    document.getElementById('stepP').textContent = c.passNote || '四关全过，进入发布。';
    showCard('通过', '四关全过', c.passNote || '契约、同源、冒烟、生产只读都过了。', c.exit != null ? `exit ${c.exit}` : null);
  }
}

// 标签投影
function project(v){
  const p = v.clone().project(camera);
  return {x:(p.x*0.5+0.5)*innerWidth, y:(-p.y*0.5+0.5)*innerHeight, vis:p.z < 1};
}
function layoutLabels(){
  for (const it of labels){
    const s = project(it.get());
    if (!s.vis) { it.el.style.opacity = 0; continue; }
    it.el.style.left = s.x + 'px';
    it.el.style.top = s.y + 'px';
    it.el.style.opacity = .95;
  }
}

// 交互
let dragging = false, lastX=0, lastY=0, moved=0;
const ray = new THREE.Raycaster();
const pt = new THREE.Vector2();

function pick(ev){
  pt.x = (ev.clientX/innerWidth)*2 - 1;
  pt.y = -(ev.clientY/innerHeight)*2 + 1;
  ray.setFromCamera(pt, camera);
  const objs = gateGroups.flatMap(g => g.children);
  const hit = ray.intersectObjects(objs, false)[0];
  if (!hit) return null;
  return hit.object.userData.owner || null;
}

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  moved += Math.abs(dx)+Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  camTarget.theta -= dx*0.006;
  camTarget.phi = Math.min(1.4, Math.max(.35, camTarget.phi - dy*0.005));
});
renderer.domElement.addEventListener('pointerup', e => {
  dragging = false;
  if (moved < 6) {
    const g = pick(e);
    if (g) {
      const st = gateState.get(g.userData.id);
      showCard('判据 · ' + g.userData.id, g.userData.spec.name, g.userData.spec.rule || '', g.userData.spec.detail || null);
    }
  }
});
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault();
  camTarget.radius = Math.min(34, Math.max(10, camTarget.radius + e.deltaY*0.012));
}, {passive:false});
renderer.domElement.addEventListener('dblclick', () => {
  camTarget.theta = CAM0.theta; camTarget.phi = CAM0.phi; camTarget.radius = CAM0.radius; camTarget.ty = CAM0.ty;
});

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  cam.theta += (camTarget.theta-cam.theta)*0.08;
  cam.phi += (camTarget.phi-cam.phi)*0.08;
  cam.radius += (camTarget.radius-cam.radius)*0.08;
  cam.ty += (camTarget.ty-cam.ty)*0.08;
  applyCam();
  updateRun(now);
  layoutLabels();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
